# Docker Compose — Full GritGauge Stack
# Usage: docker-compose up -d

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gritgauge-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gritgauge:gritgauge@db:5432/gritgauge
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gritgauge-network

  db:
    image: postgres:16-alpine
    container_name: gritgauge-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gritgauge
      - POSTGRES_PASSWORD=gritgauge
      - POSTGRES_DB=gritgauge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gritgauge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gritgauge-network

  redis:
    image: redis:7-alpine
    container_name: gritgauge-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - gritgauge-network

volumes:
  pgdata:
  redisdata:

networks:
  gritgauge-network:
    driver: bridge
